# Pehchaan alert-budget simulator: every assumption in one place.
#
# THIS IS AN ASSUMPTION-DRIVEN PROJECTION, NOT A MEASUREMENT.
# The simulator draws *triggered* payment sessions (a payment made during, or
# <= 10 min after, a call AND new payee / > p95 / >= Rs 10,000; SPEC section 2)
# from the distributions below and runs them through the real pehchaan fusion
# engine (engine/pehchaan/config.yaml). Change a number here, rerun
# `cd engine && python -m pehchaan.sim`, and every result and chart updates.
#
# Labels:  src: "<research file> #row"  -> anchored to a cited public figure
#          src: "team assumption"       -> our judgement; the rationale says why
# Research files live in research/ (india_fraud_stats_and_track02.md = IFS,
# track01_voice_cloning.md = T01).

meta:
  version: "0.2.0"   # SPEC v0.2: claim split, registry integration, checklist, user-reported negatives LR 30
  seed: 20261006
  n_genuine: 100000          # stratified: genuine sessions simulated
  n_scam_per_pattern: 30000  # stratified: sessions per scam pattern (then re-weighted by the prior)
  report_per_sessions: 100000
  upi_p2p_cap_inr: 100000    # src: NPCI UPI per-transaction limit for ordinary P2P (Rs 1 lakh); amounts are clipped to it
  p99_over_p95: 2.0          # src: team assumption; a user's p99 sits ~2x their p95

# ---------------------------------------------------------------------------
# Base rates -> a public-data anchor for the prior pi0 = P(scam | trigger fired)
# ---------------------------------------------------------------------------
base_rates:
  upi_txns_per_month:        {value: 24068380000, src: "IFS #14 (NPCI, Sep 2026: 24,068.38 mn)"}
  upi_fraud_per_mn_txns:     {value: 7,       src: "IFS #13a (FY25, derived from MoF replies + NPCI)"}
  ncrp_complaints_per_year:  {value: 2815000, src: "IFS #2 (NCRP 2025: 28.15 lakh)"}
  chakshu_relative_2025:     {value: 19564,   src: "T01 #2 (Chakshu 'Impersonation as a relative/friend', 2025)"}
  chakshu_police_2025:       {value: 54639,   src: "T01 #2 (Chakshu 'Impersonation as Police/CBI/Customs/Aadhaar/RBI', 2025)"}
  call_driven_share:         {value: 0.35, src: "team assumption", note: "share of NCRP complaints that are call-driven impersonation APP (relative, bank/KYC, police/digital arrest). NCRP 2025: investment 35% and sextortion 19% of cases are mostly not call-at-payment (IFS #3)."}
  txns_per_scam_case:        {value: 2.5,  src: "team assumption", note: "victims often pay in several instalments (T01 1a: 'demanded Rs 2 lakh more')."}
  scam_txn_meets_trigger:    {value: 0.9,  src: "team assumption", note: "paid during/after the call to a new payee; IFS #5: 98.5% of value is in txns > Rs 10k."}
  genuine_trigger_rate:      {value: 0.01, src: "team assumption", note: "1% of all UPI payments happen during/<=10 min after a call AND to a new payee / above p95 / >= Rs 10k."}
  # derived in code (written to sim_summary.json): scam_triggered_per_month, genuine_triggered_per_month, prior_derived (~1/1300)

alert_budget:   # SPEC v0.2 section 4: theta_red is tuned against this at pi0 = 1/400
  genuine_red_max_pct: 0.25
  genuine_pause_verify_max_pct: 6.0
  src: "SPEC v0.2 (lead's alert budget)"

prior:
  default_from_engine_config: true   # 1/400 (SPEC default): a cautious, risk-leaning choice vs the ~1/1300 anchor
  sweep: [0.0005, 0.001, 0.0025, 0.005, 0.01]   # 1/2000, 1/1000, 1/400, 1/200, 1/100

# ---------------------------------------------------------------------------
# Population mixes (within triggered sessions)
# ---------------------------------------------------------------------------
mix:
  genuine:
    src: "team assumption"
    note: "merchant/delivery and friend payments dominate call-adjacent UPI; family money requests are the hard case."
    G_merchant: 0.38
    G_friend: 0.30
    G_relative: 0.15
    G_elderly_noisy: 0.12
    G_bank1600: 0.05
  scam:
    src: "team assumption informed by T01 #2 (Chakshu 2025: police/CBI impersonation 54,639 vs relative 19,564) and IFS #3 (digital arrest 6% of NCRP cases)"
    T1: 0.20
    T2: 0.45
    T3: 0.35

# ---------------------------------------------------------------------------
# User behaviour and the opt-in checks
# ---------------------------------------------------------------------------
behaviour:
  voice_uptake: {value: 0.30, sweep: [0.0, 0.30, 0.70], src: "team assumption", note: "share of users who run the optional voice check once Pause & Verify is shown. Many skip it."}
  amber_cancel_if_decisive_negative: {value: 0.85, src: "team assumption", note: "Amber with a 'not me' from the real person: most users stop."}
  red_scam_completes_below_review:   {value: 0.20, src: "team assumption", note: "after a 30-min hold, a coerced victim re-confirms anyway (hold breaks urgency; SPEC 5: expiry never auto-sends)."}
  red_scam_completes_review:         {value: 0.05, src: "team assumption", note: ">= Rs 50,000 needs an analyst review before release (SPEC 5)."}
  red_genuine_completes:             {value: 0.95, src: "team assumption", note: "genuine held payments are released after a check/review; counted as Rs delayed."}
  checklist_uptake:                  {value: 0.60, src: "team assumption", note: "SPEC v0.2: the 3-tap cue checklist is the primary action on the Amber screen for 'No one' / 'Someone else'; 60% answer it."}
  amber_cancel_if_user_reported_negative: {value: 0.75, src: "team assumption", note: "after their own callback/safe-word check fails, Cancel is the primary button (SPEC v0.2); most users cancel."}
  family_verify_auto: {value: true, uptake: 0.90, src: "team assumption (SPEC v0.2 A19)", note: "Family Verify is sent automatically when the payer names an enrolled relative and the result is Amber/Red; 10% of payers cancel the request (coached or impatient). Replaces each scenario's opt-in fv.uptake; no-response stays fv.timeout."}
  fv_enrolment_sweep: {value: [0.2, 0.35, 0.5, 0.7, 0.9], src: "team assumption", note: "sensitivity only: share of payers with at least one Family Verify relative enrolled, applied to every scenario (headline uses each scenario's fv.enrolled = 0.5). Same sessions (common random numbers); everything else fixed."}

# ---------------------------------------------------------------------------
# Bank outbound-call registry (SPEC v0.2). Only an INTEGRATED bank that the user
# NAMED can answer "not calling you" (bank_no_active_call, decisive G7); a bank
# that is not integrated returns bank_registry_unknown (LR 1).
# ---------------------------------------------------------------------------
registry:
  integrated_if_own_bank:   {value: 0.85, src: "team assumption", note: "Pehchaan ships inside a bank app (own bank always integrated) or a TPAP (only partner banks); blended 85%."}
  integrated_if_other_bank: {value: 0.30, src: "team assumption", note: "a different bank than the app's own: integrated only if it joined the shared registry (DIP-style rollout)."}

detector:
  src: "PLACEHOLDER (team assumption) until ml/results/metrics.json provides band_rates; see T01 4a/4b for why unseen generators are much worse"
  unseen_generator_share: 0.5        # share of scam audio from generators the detector never saw (T01 #9/#10: big generalisation gaps)
  band_rates:                        # P(band | audio class); bands from the Voice Provenance Service
    synthetic_seen:   {likely_synthetic: 0.62, inconclusive: 0.26, no_strong_evidence: 0.12}
    synthetic_unseen: {likely_synthetic: 0.30, inconclusive: 0.35, no_strong_evidence: 0.35}
    bonafide:         {likely_synthetic: 0.06, inconclusive: 0.26, no_strong_evidence: 0.68}
  watermark_given_synthetic: {value: 0.05, src: "team assumption", note: "most scammers strip/never embed watermarks (T01 6); positive-only signal."}

# ---------------------------------------------------------------------------
# Scenarios. Keys per scenario:
#   caller: P(unknown = not a saved contact), P(international), P(voip/WhatsApp), P(number in 1600 series)
#   fri: DoT FRI tier of the caller's number (mocked in the product)
#   call_long: P(call > 15 min);  amount / user_p95: lognormal (median Rs, sigma)
#   payee: P(new); P(trusted | known) = paid >= 3 times and amount <= 1.5x usual (G5)
#   payee_flag: I4C suspect registry / mule score;  burst: P(>= 2 new payees in 30 min)
#   claim: answer to "Who asked you to make this payment?" (v0.2 options: family / my bank / UPI app, shop or
#          delivery / police-govt / someone else / no one; coached victims answer none/other)
#   name_mismatch_if_family: P(VPA name unrelated to the claimed relative | claim = family)
#   synthetic_audio: P(the 8-12 s capture contains synthetic speech); quality_ok: P(speech >= 4 s and SNR >= 10 dB)
#   cues: P(cue heard in the capture and caught by ASR)
#   fv: Family Verify: P(relative in Pehchaan circle), P(user taps it), outcome mix
#   callback / safeword: uptake and outcome mixes (user-reported; v0.2: LR 30, not decisive)
#   registry: P(user names their own bank | claim = bank), P(taps "Check with my bank"), P(registry shows a live call)
#   checklist: P(user ticks each cue | the 3-tap checklist is shown) for claim none/other at Amber
#   amber_cancel: P(user cancels after Amber)
# Every block carries src; the defaults below are team assumptions unless cited.
# ---------------------------------------------------------------------------
scenarios:
  G_friend:

    fri: {none: 0.985, medium: 0.012, high: 0.002, very_high: 0.001}
    call_long: 0.15
    amount: {median: 2000, sigma: 0.9}
    user_p95: {median: 9000, sigma: 0.7}
    payee: {new: 0.70, trusted_if_known: 0.40}
    payee_flag: {none: 0.993, medium: 0.006, high: 0.001}
    burst: 0.05
    claim: {family: 0.08, bank: 0.0, upi_or_shop: 0.02, authority: 0.0, other: 0.50, none: 0.40}
    name_mismatch_if_family: 0.40
    synthetic_audio: 0.0
    quality_ok: 0.85
    cues: {cue_secrecy: 0.02, cue_urgency: 0.08, cue_otp_pin: 0.003, cue_arrest_threat: 0.001, cue_remote_app: 0.005, cue_refund_verification: 0.01}

    callback: {uptake: 0.35, confirmed: 0.75, denied: 0.01, no_answer: 0.24}   # denied = user mis-tap / panic (user-reported, LR 30, not decisive)
    safeword: {has: 0.15, uptake: 0.6, pass: 0.90}
    registry: {named_own_bank: 0.5, uptake: 0.75, active_call: 0.0}
    checklist: {cue_secrecy: 0.01, cue_otp_pin: 0.003, cue_arrest_threat: 0.001}
